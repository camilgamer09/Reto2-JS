<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Notas del Curso</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <form id="alumnoForm">
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>
      </div>

      <div class="form-group">
        <label for="certamen1">Certamen 1:</label>
        <input type="number" id="certamen1" min="1" max="100" step="any" required>
      </div>

      <div class="form-group">
        <label for="certamen2">Certamen 2:</label>
        <input type="number" id="certamen2" min="1" max="100" step="any" required>
      </div>

      <div class="form-group">
        <label for="certamen3">Certamen 3:</label>
        <input type="number" id="certamen3" min="1" max="100" step="any" required>
      </div>

      <button type="submit" id="btnAgregar">Agregar Alumno</button>
    </form>
    
    <div id="mensajeError" class="error-msg"></div>
  </div>

  <div class="card" id="seccionResultados">
    <div id="listaAlumnos"></div>
    <div id="resumenCurso"></div>
    <div id="listaOrdenada"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
